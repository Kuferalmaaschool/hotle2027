<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Now</title>
<link rel="stylesheet" href="booking.css">
</head>
<body>

<!-- الشريط العلوي مع أدوات الوصول -->
<div class="topbar">

    <div class="tools">
        <button onclick="increaseFont()">A+</button>
        <button onclick="decreaseFont()">A-</button>
        <button onclick="toggleDark()">🌙</button>
        <button onclick="speakText()">🔊</button>
        <button onclick="toggleLang()">EN / AR</button>
    </div>

    <div class="hotel">
        <img src="logo.png" alt="Logo">
        <b>Loving Homes</b>
    </div>

</div>

<!-- شريط الصفحات -->
<div class="navbar">
    <a id="home" href="home.html">الرئيسية</a>
    <a id="packages" href="Packages.html">الحزم</a>
    <a id="rating" href="rating.html">التقييم</a>
    <a id="contact" href="contact.html">اتصل بنا</a>
    <a id="book" href="booking.html">احجز الآن</a>
    <a id="reviews" href="rating.html">آراء العملاء</a>
    <a id="products" href="products.html">المنتجات</a>
    <a id="services" href="rating.html">الخدمات</a>
    <a id="about" href="about.html">عن الفندق</a>
    <a id="gallery" href="gallery.html">معرض الصور</a>
</div>

<h1 id="pageTitle">Booking Form</h1>

<form id="bookingForm">
    <label for="name" id="labelName">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email" id="labelEmail">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="package" id="labelPackage">Selected Package:</label>
    <input type="text" id="package" name="package" readonly>

    <label for="date" id="labelDate">Check-in Date:</label>
    <input type="date" id="date" name="date" required>

    <label for="notes" id="labelNotes">Additional Notes:</label>
    <textarea id="notes" name="notes"></textarea>

    <button type="submit" id="submitBtn">Submit Booking</button>
</form>

<script>
// جلب اسم الحزمة من الـ URL
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const selectedPackage = params.get('package');
    if(selectedPackage){
        document.getElementById('package').value = selectedPackage;
    }
});

/* تكبير وتصغير الخط */
function increaseFont() { document.body.style.fontSize = "larger"; }
function decreaseFont() { document.body.style.fontSize = "smaller"; }

/* الوضع الليلي */
function toggleDark() {
    if (document.body.style.background === "white") {
        document.body.style.background = "#0f172a";
        document.body.style.color = "white";
    } else {
        document.body.style.background = "white";
        document.body.style.color = "black";
    }
}

/* تحويل النص إلى صوت */
function speakText() {
    let text = document.body.innerText;
    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = lang === "ar" ? "ar-SA" : "en-US";
    speechSynthesis.speak(speech);
}

/* تغيير اللغة */
let lang = "ar";
function toggleLang() {
    if (lang === "ar") {
        document.documentElement.dir = "ltr";

        document.getElementById("pageTitle").innerText = "Booking Form";
        document.getElementById("labelName").innerText = "Name:";
        document.getElementById("labelEmail").innerText = "Email:";
        document.getElementById("labelPackage").innerText = "Selected Package:";
        document.getElementById("labelDate").innerText = "Check-in Date:";
        document.getElementById("labelNotes").innerText = "Additional Notes:";
        document.getElementById("submitBtn").innerText = "Submit Booking";

        document.getElementById("home").innerText = "Home";
        document.getElementById("packages").innerText = "Packages";
        document.getElementById("rating").innerText = "Rating";
        document.getElementById("contact").innerText = "Contact";
        document.getElementById("book").innerText = "Book Now";
        document.getElementById("reviews").innerText = "Customer Reviews";
        document.getElementById("products").innerText = "Products";
        document.getElementById("services").innerText = "Services";
        document.getElementById("about").innerText = "About Hotel";
        document.getElementById("gallery").innerText = "Gallery";

        lang = "en";
    } else {
        document.documentElement.dir = "rtl";

        document.getElementById("pageTitle").innerText = "نموذج الحجز";
        document.getElementById("labelName").innerText = "الاسم:";
        document.getElementById("labelEmail").innerText = "البريد الإلكتروني:";
        document.getElementById("labelPackage").innerText = "الحزمة المختارة:";
        document.getElementById("labelDate").innerText = "تاريخ الوصول:";
        document.getElementById("labelNotes").innerText = "ملاحظات إضافية:";
        document.getElementById("submitBtn").innerText = "إرسال الحجز";

        document.getElementById("home").innerText = "الرئيسية";
        document.getElementById("packages").innerText = "الحزم";
        document.getElementById("rating").innerText = "التقييم";
        document.getElementById("contact").innerText = "اتصل بنا";
        document.getElementById("book").innerText = "احجز الآن";
        document.getElementById("reviews").innerText = "آراء العملاء";
        document.getElementById("products").innerText = "المنتجات";
        document.getElementById("services").innerText = "الخدمات";
        document.getElementById("about").innerText = "عن الفندق";
        document.getElementById("gallery").innerText = "معرض الصور";

        lang = "ar";
    }
}
</script>
</body>
</html>
