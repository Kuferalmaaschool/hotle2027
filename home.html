<script>

/* تكبير الخط */

function increaseFont(){
document.body.style.fontSize="larger";
}

/* تصغير الخط */

function decreaseFont(){
document.body.style.fontSize="smaller";
}

/* الوضع الليلي */

function toggleDark(){

if(document.body.style.background=="white"){

document.body.style.background="#0f172a";
document.body.style.color="white";

}else{

document.body.style.background="white";
document.body.style.color="black";

}

}

/* تحويل النص لصوت */

function speakText(){

let text=document.body.innerText;

let speech=new SpeechSynthesisUtterance(text);

speech.lang="ar";

speechSynthesis.speak(speech);

}

/* تغيير اللغة */

let lang="ar";

function toggleLang(){

if(lang==="ar"){

document.documentElement.dir="ltr";

document.getElementById("home").innerText="Home";
document.getElementById("packages").innerText="Packages";
document.getElementById("rating").innerText="Rating";
document.getElementById("contact").innerText="Contact Us";
document.getElementById("book").innerText="Book Now";
document.getElementById("reviews").innerText="Customer Reviews";
document.getElementById("products").innerText="Products";
document.getElementById("services").innerText="Services";
document.getElementById("about").innerText="About Hotel";
document.getElementById("gallery").innerText="Gallery";

document.getElementById("welcomeTitle").innerText="Welcome to Loving Homes Dog Hotel";
document.getElementById("welcomeText").innerText="We provide the best care for dogs in Hong Kong.";

document.getElementById("whyTitle").innerText="Why Choose Loving Homes";

document.getElementById("c1").innerText="24 Hour Care";
document.getElementById("c2").innerText="Large Play Areas";
document.getElementById("c3").innerText="Medical Care";
document.getElementById("c4").innerText="Comfortable Rooms";

lang="en";

}else{

document.documentElement.dir="rtl";

document.getElementById("reviews").innerText="آراء العملاء";
document.getElementById("products").innerText="المنتجات";
document.getElementById("services").innerText="الخدمات";
document.getElementById("about").innerText="عن الفندق";

document.getElementById("welcomeText").innerText="نقدم أفضل رعاية للكلاب في هونغ كونغ حيث يشعر كلبك وكأنه في منزله";

document.getElementById("c2").innerText="أماكن لعب واسعة";
document.getElementById("c3").innerText="رعاية طبية";
document.getElementById("c4").innerText="غرف مريحة";

lang="ar";

}

}
